name: Terraform Plan

# Manual dry-run path only — see ADR-0009. A real, authenticated plan against
# one environment's live state, gated by that environment's protection rules
# (if any). Run this before triggering Terraform Apply. The cheap, PR-triggered
# syntax/lint check lives separately in terraform-validate.yml.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Real plan against live AWS state, no apply. Uses the same GitHub
  # Environment as Terraform Apply, so the OIDC subject matches and that
  # environment's protection rules (required reviewers) apply here too.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color 2>&1 | tee plan-output.txt
        env:
          # None of these are secret (CIDRs, tags, region) — all sourced from this
          # environment's GitHub Environment variables, never repo-level.
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_cost_center: ${{ vars.COST_CENTER }}
          TF_VAR_data_classification: ${{ vars.DATA_CLASSIFICATION }}
          TF_VAR_owner: ${{ vars.OWNER }}
          TF_VAR_retention_policy: ${{ vars.RETENTION_POLICY }}
          # JSON list of role ARN(s) allowed to administer this platform's KMS CMKs (rotate,
          # rewrite key policy, schedule/cancel deletion) — set by bootstrap-env.sh from
          # bootstrap/'s kms_admin_role_arn output. See ADR-0013 and docs/deployment.md.
          # || '[]' matches the variable's own Terraform default (variables.tf) — needed
          # because an unset GitHub Environment variable resolves to "" here, and Terraform
          # fails trying to HCL-parse an empty string as a list(string), not "use the default".
          TF_VAR_kms_admin_role_arns: ${{ vars.KMS_ADMIN_ROLE_ARNS || '[]' }}
          TF_VAR_network_shared_vpc_cidr: ${{ vars.NETWORK_SHARED_VPC_CIDR }}
          TF_VAR_network_shared_private_subnet_cidrs: ${{ vars.NETWORK_SHARED_PRIVATE_SUBNET_CIDRS }}
          TF_VAR_integration_vpc_cidr: ${{ vars.INTEGRATION_VPC_CIDR }}
          TF_VAR_integration_private_subnet_cidrs: ${{ vars.INTEGRATION_PRIVATE_SUBNET_CIDRS }}
          TF_VAR_nrt_processing_vpc_cidr: ${{ vars.NRT_PROCESSING_VPC_CIDR }}
          TF_VAR_nrt_processing_private_subnet_cidrs: ${{ vars.NRT_PROCESSING_PRIVATE_SUBNET_CIDRS }}
          TF_VAR_data_vpc_cidr: ${{ vars.DATA_VPC_CIDR }}
          TF_VAR_data_private_subnet_cidrs: ${{ vars.DATA_PRIVATE_SUBNET_CIDRS }}
          # On-prem connectivity stays disabled until a real DX/VPN circuit exists —
          # flip these on (and add the matching dx_*/customer_gateway_* TF_VAR_ entries)
          # once one does.
          TF_VAR_enable_dx: "false"
          TF_VAR_enable_vpn: "false"
          # MSK/Flink/Redis/lakehouse sizing — || falls back to the same default already in
          # variables.tf, so this stays safe even if bootstrap-env.sh hasn't been rerun since
          # these were added (an unset GitHub Environment variable resolves to "" here, which
          # would otherwise flow through as an explicit empty string, not "use the default").
          TF_VAR_msk_kafka_version: ${{ vars.MSK_KAFKA_VERSION || '3.9.x' }}
          TF_VAR_msk_number_of_broker_nodes: ${{ vars.MSK_NUMBER_OF_BROKER_NODES || '4' }}
          TF_VAR_msk_broker_instance_type: ${{ vars.MSK_BROKER_INSTANCE_TYPE || 'kafka.m5.large' }}
          TF_VAR_msk_broker_ebs_volume_size: ${{ vars.MSK_BROKER_EBS_VOLUME_SIZE || '100' }}
          TF_VAR_flink_application_jar_s3_key: ${{ vars.FLINK_APPLICATION_JAR_S3_KEY || 'flink-jobs/bootstrap-noop.jar' }}
          TF_VAR_flink_parallelism: ${{ vars.FLINK_PARALLELISM || '2' }}
          TF_VAR_redis_node_type: ${{ vars.REDIS_NODE_TYPE || 'cache.r7g.large' }}
          TF_VAR_redis_num_cache_clusters: ${{ vars.REDIS_NUM_CACHE_CLUSTERS || '2' }}
          TF_VAR_ods_retention_days: ${{ vars.ODS_RETENTION_DAYS || '7' }}
          TF_VAR_enable_decisioning_in_platform: ${{ vars.ENABLE_DECISIONING_IN_PLATFORM || 'false' }}
          TF_VAR_ses_domain: ${{ vars.SES_DOMAIN }}
          # No sensible fallback for these two — a real, unique bucket name and a real JAR
          # location can't be invented. Left unset, Terraform will fail loudly rather than
          # silently apply against a placeholder value (see modules/lakehouse, modules/flink-emr).
          TF_VAR_lakehouse_bucket_name: ${{ vars.LAKEHOUSE_BUCKET_NAME }}
          TF_VAR_flink_application_jar_s3_bucket_arn: ${{ vars.FLINK_APPLICATION_JAR_S3_BUCKET_ARN }}

      - name: Post plan to step summary
        if: always()
        env:
          MATRIX_ENVIRONMENT: ${{ inputs.environment }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          STATUS_ICON=$([[ "${PLAN_OUTCOME}" == "success" ]] && echo "✅" || echo "❌")
          {
            echo "## ${STATUS_ICON} Terraform Plan: \`${MATRIX_ENVIRONMENT}\`"
            echo ""
            echo "> **This is a dry-run.** Nothing has been created or changed in AWS."
            echo "> To apply, trigger the **Terraform Apply** workflow with the same environment."
            echo ""
            echo "<details><summary>Show plan</summary>"
            echo ""
            echo '```hcl'
            cat plan-output.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
