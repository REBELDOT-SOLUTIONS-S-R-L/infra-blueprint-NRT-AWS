name: Terraform Validate

# PR-only path — see ADR-0009. Cheap syntax/lint check, no AWS auth, no
# `environment:` key, safe on every PR regardless of who opened it. The real,
# authenticated dry-run lives separately in terraform-plan.yml
# (workflow_dispatch only).

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build matrix
        id: changes
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(environments|modules)/' \
            | sed -E 's|^environments/([^/]+)/.*|\1|; t; s|^modules/.*|ALL|' \
            | sort -u)

          echo "Raw changes: ${CHANGED}"

          if echo "${CHANGED}" | grep -qx "ALL"; then
            MATRIX='{"include":[{"environment":"dev"},{"environment":"staging"},{"environment":"prod"}]}'
          else
            INCLUDES=""
            while IFS= read -r env; do
              if [[ -n "${env}" ]]; then
                INCLUDES="${INCLUDES}{\"environment\":\"${env}\"},"
              fi
            done <<< "${CHANGED}"
            INCLUDES="${INCLUDES%,}"
            MATRIX="{\"include\":[${INCLUDES}]}"
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${MATRIX}"

  validate:
    name: Validate (${{ matrix.environment }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init (no backend — no AWS auth required)
        id: init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform Format Check
        id: fmt
        working-directory: environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive -no-color

      - name: Post validation result as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          MATRIX_ENVIRONMENT: ${{ matrix.environment }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
        with:
          script: |
            const body = `#### Terraform Validation: \`${process.env.MATRIX_ENVIRONMENT}\`

            | Check | Result |
            |---|---|
            | **Init** | \`${process.env.INIT_OUTCOME}\` |
            | **Validate** | \`${process.env.VALIDATE_OUTCOME}\` |
            | **Format** | \`${process.env.FMT_OUTCOME}\` |`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ---------------------------------------------------------------------------
  # Gate job: single stable status-check name for a branch protection rule.
  # Passes once all validate matrix jobs succeed.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All Terraform validation checks passed"
